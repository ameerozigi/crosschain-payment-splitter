[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
remappings = [
    "forge-std/=node_modules/forge-std/",
    "openzeppelin-contracts/=node_modules/@openzeppelin/contracts/",
]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[profile.ci]
verbosity = 3